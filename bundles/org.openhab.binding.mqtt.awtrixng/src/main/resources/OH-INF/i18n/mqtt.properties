# thing types config

thing-type.config.mqtt.awtrixng-app.appname.label = App Name
thing-type.config.mqtt.awtrixng-app.appname.description = Name of the app on the clock, 1 to 32 letters, digits, - or _.
thing-type.config.mqtt.awtrixng-app.useButtons.label = Button Controlled
thing-type.config.mqtt.awtrixng-app.useButtons.description = Activate if the user can control the app with the buttons of the clock. The select button locks the clock on the app, and the app then reports the buttons until the app selection timeout of the clock thing has passed. Every button press restarts the timeout.
thing-type.config.mqtt.awtrixng-clock.appLockTimeout.label = App Selection Timeout
thing-type.config.mqtt.awtrixng-clock.appLockTimeout.description = Timeout until a selected app returns control and the app rotation continues.
thing-type.config.mqtt.awtrixng-clock.basetopic.label = Base Topic
thing-type.config.mqtt.awtrixng-clock.basetopic.description = MQTT prefix of the clock, as shown in its MQTT settings. By default this is the 12 character MAC address of the clock.
thing-type.config.mqtt.awtrixng-clock.discoverDefaultApps.label = Discover Built-in Apps
thing-type.config.mqtt.awtrixng-clock.discoverDefaultApps.description = Also offer the built-in apps of the clock (Time, Date, Temperature, Humidity, Battery). Their look is set with the settings channels of the clock, and an app created for one of them would be pushed under the same name.

